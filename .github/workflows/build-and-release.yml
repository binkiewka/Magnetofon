name: Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build & Test Linux App (Qt6 / CMake)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Qt 6 and Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            g++ \
            pkg-config \
            qt6-base-dev \
            qt6-declarative-dev \
            qml6-module-qtquick* \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-templates \
            qml6-module-qtquick-window \
            qml6-module-qtquick-layouts \
            qt6-tools-dev \
            libmpv-dev \
            libpulse-dev \
            libavformat-dev \
            libavcodec-dev \
            libavutil-dev \
            libx11-dev \
            xvfb \
            desktop-file-utils \
            squashfs-tools \
            file

      - name: Configure CMake
        run: |
          cmake -B src-cpp/build -S src-cpp \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -GNinja

      - name: Build Application
        run: |
          cmake --build src-cpp/build --config Release

      - name: Run Integration Tests
        run: |
          xvfb-run --auto-servernum ctest --test-dir src-cpp/build --output-on-failure

      - name: Package Linux AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps release-artifacts
          cp src-cpp/build/MagnetofonNative AppDir/usr/bin/
          cp resources/icon-256.png AppDir/magnetofon.png
          cp resources/icon-256.png AppDir/usr/share/icons/hicolor/256x256/apps/magnetofon.png
          cp src-cpp/packaging/magnetofon.desktop AppDir/magnetofon.desktop
          desktop-file-validate AppDir/magnetofon.desktop
          cat << "EOF" > AppDir/AppRun
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          exec "${HERE}/usr/bin/MagnetofonNative" "$@"
          EOF
          chmod +x AppDir/AppRun
          wget -q https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run -n AppDir release-artifacts/Magnetofon-x86_64.AppImage
          rm -rf AppDir appimagetool-x86_64.AppImage

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: release-artifacts/*.AppImage
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-linux
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine release tag
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v1.0.2"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -type f | sort)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets found" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Magnetofon ST-8000 ${RELEASE_TAG}" \
              --notes "Magnetofon ST-8000 — High-Fidelity Audio Console (Native C++ / Qt 6 QML)" \
              --draft=false \
              --prerelease=false
          else
            gh release create "$RELEASE_TAG" \
              --title "Magnetofon ST-8000 ${RELEASE_TAG}" \
              --notes "Magnetofon ST-8000 — High-Fidelity Audio Console (Native C++ / Qt 6 QML)"
          fi

          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
