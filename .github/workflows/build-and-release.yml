name: Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux Packages (deb & AppImage)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential patchelf libssl-dev libxdo-dev libayatana-appindicator3-dev libasound2-dev libpulse-dev libgl1-mesa-dev libgles2-mesa-dev libx11-dev libxext-dev libxrandr-dev libxi-dev libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev fuse libfuse2 squashfs-tools file xdg-utils

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Build Frontend
        run: npm run build

      - name: Build Tauri App (Linux)
        uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles deb

      - name: Build AppImage via appimagetool
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/512x512/apps src-tauri/target/release/bundle/appimage
          cp src-tauri/target/release/magnetofon AppDir/usr/bin/
          cp src-tauri/icons/128x128.png AppDir/magnetofon.png
          cp src-tauri/icons/128x128.png AppDir/usr/share/icons/hicolor/512x512/apps/magnetofon.png
          cat << "EOF" > AppDir/magnetofon.desktop
          [Desktop Entry]
          Name=Magnetofon
          Exec=magnetofon
          Icon=magnetofon
          Type=Application
          Categories=Audio;Music;Player;
          EOF
          cat << "EOF" > AppDir/AppRun
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          exec "${HERE}/usr/bin/magnetofon" "$@"
          EOF
          chmod +x AppDir/AppRun
          wget -q https://github.com/AppImage/AppImageKit/releases/download/13/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          version="$(node -p "require('./package.json').version")"
          ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir "src-tauri/target/release/bundle/appimage/Magnetofon_${version}_amd64.AppImage"
          rm -rf AppDir appimagetool-x86_64.AppImage

      - name: Upload Linux bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error

  build-windows:
    name: Build Windows Package (NSIS & MSI Installer)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Build Frontend
        run: npm run build

      - name: Build Tauri App (Windows)
        uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles nsis,msi

      - name: Upload Windows bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows
    if: github.event_name != 'pull_request'
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine release tag
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            version="$(node -p "require('./package.json').version")"
            tag="v${version}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -type f | sort)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets found" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Magnetofon ST-8000 ${RELEASE_TAG}" \
              --notes "Magnetofon ST-8000 — High-Fidelity Audio Console & Native MilkDrop Visualizer Engine" \
              --draft=false \
              --prerelease=false
          else
            gh release create "$RELEASE_TAG" \
              --title "Magnetofon ST-8000 ${RELEASE_TAG}" \
              --notes "Magnetofon ST-8000 — High-Fidelity Audio Console & Native MilkDrop Visualizer Engine"
          fi

          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
