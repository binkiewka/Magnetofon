name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:


permissions:
  contents: read

jobs:
  build-linux:
    name: Build & Test Linux App (Qt6 / CMake)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Release Version
        run: |
          version="$(sed -n 's/^project(Magnetofon VERSION \([0-9.]*\).*/\1/p' src-cpp/CMakeLists.txt)"
          test -n "$version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi

      - name: Install Qt 6 and Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            g++ \
            pkg-config \
            qt6-base-dev \
            qt6-declarative-dev \
            qml6-module-qtqml-workerscript \
            qml6-module-qttest \
            qml6-module-qtquick* \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-templates \
            qml6-module-qtquick-window \
            qml6-module-qtquick-layouts \
            qt6-tools-dev \
            libmpv-dev \
            libpulse-dev \
            unzip \
            libavformat-dev \
            libavcodec-dev \
            libavutil-dev \
            libavfilter-dev \
            libx11-dev \
            ffmpeg \
            xvfb \
            desktop-file-utils \
            squashfs-tools \
            file

      - name: Generate Multichannel Media Fixtures
        run: |
          mkdir -p ci-fixtures

          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=size=320x180:rate=24:duration=3" \
            -f lavfi -i "aevalsrc=0.10*sin(2*PI*220*t)|0.10*sin(2*PI*330*t)|0.10*sin(2*PI*440*t)|0.05*sin(2*PI*55*t)|0.10*sin(2*PI*550*t)|0.10*sin(2*PI*660*t):s=48000:d=3:c=5.1" \
            -f lavfi -i "aevalsrc=0.10*sin(2*PI*440*t)|0.10*sin(2*PI*660*t):s=48000:d=3:c=stereo" \
            -map 0:v:0 -map 1:a:0 -map 2:a:0 \
            -c:v ffv1 \
            -c:a:0 ac3 -b:a:0 640k \
            -metadata:s:a:0 language=eng \
            -metadata:s:a:0 title="Dolby Digital 5.1" \
            -disposition:a:0 default \
            -c:a:1 flac \
            -metadata:s:a:1 language=eng \
            -metadata:s:a:1 title="Lossless Stereo" \
            -disposition:a:1 0 \
            -shortest ci-fixtures/multichannel-video.mkv

          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "aevalsrc=0.10*sin(2*PI*220*t)|0.10*sin(2*PI*330*t)|0.10*sin(2*PI*440*t)|0.05*sin(2*PI*55*t)|0.10*sin(2*PI*550*t)|0.10*sin(2*PI*660*t):s=48000:d=2:c=5.1" \
            -c:a flac ci-fixtures/multichannel.flac

          ffprobe -v error \
            -show_entries stream=index,codec_type,codec_name,sample_rate,channels,channel_layout,width,height \
            -of compact ci-fixtures/multichannel-video.mkv

      - name: Configure CMake
        run: |
          cmake -B src-cpp/build -S src-cpp \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -GNinja

      - name: Build Application
        run: |
          cmake --build src-cpp/build --config Release

      - name: Run Integration Tests
        run: |
          MAGNETOFON_SURROUND_TEST_FILE="$GITHUB_WORKSPACE/ci-fixtures/multichannel.flac" \
          MAGNETOFON_VIDEO_TEST_FILE="$GITHUB_WORKSPACE/ci-fixtures/multichannel-video.mkv" \
          MAGNETOFON_MULTITRACK_VIDEO_TEST_FILE="$GITHUB_WORKSPACE/ci-fixtures/multichannel-video.mkv" \
          MAGNETOFON_VIDEO_TEST_DIR="$GITHUB_WORKSPACE/ci-fixtures" \
          QT_QPA_PLATFORM=offscreen \
            ctest --test-dir src-cpp/build --output-on-failure

      - name: Build and Run Sanitizer Regressions
        run: |
          cmake -S src-cpp -B sanitizer-build -GNinja \
            -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON \
            -DMAGNETOFON_ENABLE_SANITIZERS=ON
          cmake --build sanitizer-build --parallel 2
          MAGNETOFON_SURROUND_TEST_FILE="$GITHUB_WORKSPACE/ci-fixtures/multichannel.flac" \
          MAGNETOFON_VIDEO_TEST_FILE="$GITHUB_WORKSPACE/ci-fixtures/multichannel-video.mkv" \
          MAGNETOFON_MULTITRACK_VIDEO_TEST_FILE="$GITHUB_WORKSPACE/ci-fixtures/multichannel-video.mkv" \
          MAGNETOFON_VIDEO_TEST_DIR="$GITHUB_WORKSPACE/ci-fixtures" \
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software \
            ctest --test-dir sanitizer-build --output-on-failure

      - name: Smoke Test Bundled projectM Runtime
        run: |
          python3 scripts/verify-projectm-runtime.py
          bash scripts/smoke-test-projectm-linux.sh

      - name: Package Linux AppImage & DEB
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/libexec/magnetofon AppDir/usr/share/magnetofon/visuals AppDir/usr/share/icons/hicolor/256x256/apps release-artifacts
          cp src-cpp/build/MagnetofonNative AppDir/usr/bin/
          mkdir -p AppDir/usr/share/doc/magnetofon
          cp LICENSE THIRD-PARTY.md AppDir/usr/share/doc/magnetofon/
          cp -a resources/licenses AppDir/usr/share/doc/magnetofon/licenses
          cp resources/mpv/NOTICE.md AppDir/usr/share/doc/magnetofon/mpv-NOTICE.md
          cp /usr/bin/unzip AppDir/usr/bin/unzip
          cp -a resources/projectm/linux-x64 AppDir/usr/libexec/magnetofon/projectm
          cp -a visuals/curated AppDir/usr/share/magnetofon/visuals/curated
          cp resources/icon-256.png AppDir/magnetofon.png
          cp resources/icon-256.png AppDir/usr/share/icons/hicolor/256x256/apps/magnetofon.png
          cp src-cpp/packaging/magnetofon.desktop AppDir/magnetofon.desktop
          desktop-file-validate AppDir/magnetofon.desktop
          desktop-file-validate src-cpp/packaging/magnetofon-deb.desktop

          # Build CPack Debian package
          (cd src-cpp/build && cpack -G DEB)
          for deb_file in src-cpp/build/*.deb; do
            bash src-cpp/packaging/fix-deb-dependencies.sh "$deb_file"
          done
          cp src-cpp/build/*.deb release-artifacts/

          # Build self-contained Linux AppImage with bundled Qt6 & QML runtime
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

          # Copy bundled projectM libraries so linuxdeploy finds them
          mkdir -p AppDir/usr/lib
          cp -a resources/projectm/linux-x64/lib/*.so* AppDir/usr/lib/

          # QtQuick imports QtQml.WorkerScript implicitly, so qmlimportscanner
          # does not reliably deploy it. Copy the module explicitly.
          qt_qml_dir="$(qtpaths6 --query QT_INSTALL_QML)"
          test -f "$qt_qml_dir/QtQml/WorkerScript/libworkerscriptplugin.so"
          mkdir -p AppDir/usr/qml/QtQml
          cp -a "$qt_qml_dir/QtQml/WorkerScript" AppDir/usr/qml/QtQml/

          export QML_SOURCES_PATHS=src-cpp/ui/qml
          export LD_LIBRARY_PATH="$PWD/resources/projectm/linux-x64/lib:$LD_LIBRARY_PATH"
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/MagnetofonNative \
            --executable AppDir/usr/bin/unzip \
            --executable AppDir/usr/libexec/magnetofon/projectm/bin/projectMSDL \
            --desktop-file AppDir/magnetofon.desktop \
            --icon-file AppDir/magnetofon.png \
            --plugin qt \
            --output appimage


          version="$(sed -n 's/^project(Magnetofon VERSION \([0-9.]*\).*/\1/p' src-cpp/CMakeLists.txt)"
          appimage="release-artifacts/Magnetofon-$version-x86_64.AppImage"
          mv Magnetofon*.AppImage "$appimage"

          # A healthy GUI remains open. Missing QML modules make it exit early.
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 8s xvfb-run --auto-servernum \
            "$appimage" \
            "$GITHUB_WORKSPACE/ci-fixtures/multichannel-video.mkv" \
            > appimage-smoke.log 2>&1
          appimage_status=$?
          set -e
          if [ "$appimage_status" -ne 124 ]; then
            cat appimage-smoke.log
            exit 1
          fi
          grep -F "[AudioPlayer] Source audio channels: 6" appimage-smoke.log


      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: release-artifacts/*
          if-no-files-found: error

  build-windows:
    name: Build & Package Windows App (Qt6 / MSVC / CMake)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Setup MSVC & Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64


      - name: Download & Extract Windows libmpv dev library
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path mpv-dev -Force
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $url = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261111/mpv-dev-x86_64-20261111-git-bcde6b93cc.7z"
          Invoke-WebRequest -Uri $url -OutFile "mpv-dev.7z" -UserAgent "NativeHost"
          if ((Get-Item "mpv-dev.7z").Length -lt 1000000) {
              Write-Host "Invoke-WebRequest produced small file, retrying with curl.exe..."
              curl.exe -sSL "$url" -o "mpv-dev.7z"
          }
          $expected = "273c079b11ea5575822f972756f4c9a71149a5c10130353abeb8586738938452"
          if ((Get-FileHash mpv-dev.7z -Algorithm SHA256).Hash.ToLower() -ne $expected) {
              throw "Pinned libmpv archive checksum mismatch"
          }
          7z x mpv-dev.7z -ompv-dev -y
          if ($LASTEXITCODE -ne 0) { throw "libmpv extraction failed" }




      - name: Configure CMake
        shell: cmd
        run: |
          cmake -B src-cpp/build -S src-cpp ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DBUILD_TESTING=OFF ^
            -DMPV_INCLUDE_DIRS="%CD%\mpv-dev" ^
            -DMPV_LIBRARY_DIRS="%CD%\mpv-dev" ^
            -GNinja

      - name: Build Application
        shell: cmd
        run: |
          cmake --build src-cpp/build --config Release

      - name: Package Windows Bundle (ZIP & EXE)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path release-artifacts
          New-Item -ItemType Directory -Path dist-win
          Copy-Item src-cpp\build\MagnetofonNative.exe dist-win\MagnetofonNative.exe
          Copy-Item LICENSE, THIRD-PARTY.md dist-win\
          Copy-Item resources\licenses dist-win\licenses -Recurse
          Copy-Item resources\mpv\NOTICE.md dist-win\mpv-NOTICE.md
          Copy-Item mpv-dev\libmpv-2.dll dist-win\libmpv-2.dll -ErrorAction Stop
          windeployqt --qmldir src-cpp/ui/qml dist-win/MagnetofonNative.exe
          if ($LASTEXITCODE -ne 0) { throw "Qt deployment failed" }
          $version = [regex]::Match((Get-Content src-cpp/CMakeLists.txt -Raw), 'project\(Magnetofon VERSION ([0-9.]+)').Groups[1].Value
          if (!$version) { throw "Missing project version" }
          if ((Get-Item dist-win\MagnetofonNative.exe).VersionInfo.ProductVersion -ne $version) { throw "Executable version does not match CMake" }
          Compress-Archive -Path dist-win\* -DestinationPath "release-artifacts\Magnetofon-$version-Windows-x64.zip"

      - name: Smoke Test Extracted Windows Bundle
        shell: powershell
        run: |
          $bundle = Get-Item release-artifacts\*.zip
          Expand-Archive $bundle.FullName -DestinationPath extracted-win
          $private = Join-Path $env:RUNNER_TEMP "magnetofon-smoke"
          New-Item -ItemType Directory -Path $private -Force | Out-Null
          $env:APPDATA = $private
          $env:LOCALAPPDATA = $private
          $env:QT_LOGGING_TO_CONSOLE = '1'
          $env:QT_QUICK_BACKEND = 'software'
          $process = Start-Process -FilePath "$PWD\extracted-win\MagnetofonNative.exe" -PassThru -RedirectStandardOutput "$private\out.log" -RedirectStandardError "$private\err.log"
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) {
              Get-Content "$private\out.log", "$private\err.log"
              throw "Extracted Windows app exited during startup: $($process.ExitCode)"
          }
          if (!$process.CloseMainWindow()) { Stop-Process -Id $process.Id }
          if (!$process.WaitForExit(10000)) { Stop-Process -Id $process.Id; throw "Windows app did not close" }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: release-artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine release tag
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v2.0.0"

          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -type f | sort)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets found" >&2
            exit 1
          fi

          (cd release-assets && sha256sum -- * > SHA256SUMS)
          assets+=(release-assets/SHA256SUMS)
          notes="docs/releases/$RELEASE_TAG.md"
          test -s "$notes"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
            gh release edit "$RELEASE_TAG" \
              --title "Magnetofon ST-8000 ${RELEASE_TAG}" \
              --notes-file "$notes" \
              --draft=true \
              --prerelease=false
          else
            gh release create "$RELEASE_TAG" \
              --title "Magnetofon ST-8000 ${RELEASE_TAG}" \
              --notes-file "$notes" --draft
          fi

          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
