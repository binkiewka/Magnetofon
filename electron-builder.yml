appId: com.magnetofon.app
productName: Magnetofon
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,for_dev.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!visuals/**'
  - '!vendor/**'
  - '!_plugin_extract/**'
  - '!resources/projectm/include/**'
  - '!resources/projectm/src/**'
  - '!resources/projectm/CMakeLists.txt'
asarUnpack:
  - resources/**
win:
  executableName: magnetofon
  target:
    - nsis
  extraResources:
    - from: resources/projectm
      to: projectm
      filter:
        - '**/*'
        - '!linux-x64/**'
        - '!**/*.so*'
        - '!include/**'
        - '!src/**'
        - '!CMakeLists.txt'
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
linux:
  target:
    - AppImage
    - deb
  maintainer: Magnetofon Team
  category: Audio;AudioVideo;Player;
  extraResources:
    - from: resources/projectm
      to: projectm
      filter:
        - '**/*'
        - '!win-x64/**'
        - '!**/*.exe'
        - '!**/*.dll'
        - '!include/**'
        - '!src/**'
        - '!CMakeLists.txt'
  mimeTypes:
    - audio/mpeg
    - audio/flac
    - audio/x-flac
    - audio/wav
    - audio/x-wav
    - audio/ogg
    - audio/mp4
    - audio/aac
    - audio/x-mpegurl

fileAssociations:
  - ext: mp3
    name: MP3 Audio Track
    role: Viewer
    mimeType: audio/mpeg
  - ext: flac
    name: FLAC Audio Track
    role: Viewer
    mimeType: audio/flac
  - ext: wav
    name: WAV Audio Track
    role: Viewer
    mimeType: audio/wav
  - ext: ogg
    name: Ogg Audio Track
    role: Viewer
    mimeType: audio/ogg
  - ext: m4a
    name: M4A Audio Track
    role: Viewer
    mimeType: audio/mp4
  - ext: aac
    name: AAC Audio Track
    role: Viewer
    mimeType: audio/aac
  - ext: m3u
    name: M3U Playlist
    role: Viewer
    mimeType: audio/x-mpegurl

appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
